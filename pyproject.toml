[project]
name = "mlx-tui"
version = "0.1.0"
description = "mlx tui"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "textual>=8.2.8",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PL", "UP", "TID", "ASYNC", "DTZ"]

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-includes = ["src", "tests"]
search-path = ["src", "tests"]
infer-with-first-use = false
python-version = "3.13"
preset = "strict"